name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is set to: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print ($1=="1"?$2:$1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version from environment."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version ($JAVA_MAJOR) is lower than 17. Java 17 or newer is required."
            exit 1
          fi
          echo "Active Java version $JAVA_MAJOR satisfies the requirement (17 or newer)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found at repository root."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Confirmed: ./debug.keystore exists and is ready for debug signing."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APK paths:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have a valid .apk extension."
              exit 1
              ;;
          esac

          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Confirmed: Verified valid debug APK at $EXPECTED_APK (size: $APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP}/release-apk.XXXXXX")
          RAW_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_NAME" ]; then
            CLEAN_NAME="android-app"
          fi
          RELEASE_FILENAME="${CLEAN_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"

          cp -p "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "::error::Failed to copy APK to temporary release path $TARGET_PATH"
            exit 1
          fi

          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_PATH ($RELEASE_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset file does not exist: $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset is not an APK: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          This is an automatically generated debug APK build created for testing.

          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: `${{ github.sha }}`
          - **Signing**: Signed with a temporary debug keystore
          - **Usage Notice**: This APK is intended for testing and debugging purposes only. It is not a Play Store production release.

          Download the APK directly from the **Assets** section below.
          EOF
          )

          echo "Publishing release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "Release successfully created with tag: $RELEASE_TAG"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name -q .name 2>/dev/null || echo "Debug APK Build #${{ github.run_number }}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK build succeeded!**"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset File**: \`$ASSET_NAME\`"
              echo ""
              echo "📱 You can download the APK directly to your phone from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo ""
              echo "📦 The normal GitHub Actions artifact (\`app-debug-apk\`) is also preserved and available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed. (Outcome: $RELEASE_OUTCOME)"
            echo "The debug APK build and artifact upload succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK build and artifact upload succeeded!**"
              echo ""
              echo "⚠️ **Release Publishing Notice**: Automatic GitHub Release publishing was not completed. The workflow built-in token permissions or repository release settings may have restricted release creation."
              echo ""
              echo "📦 **How to download your APK**:"
              echo "- Go to the **Summary** tab of this workflow run."
              echo "- Locate the **Artifacts** section at the bottom."
              echo "- Download **app-debug-apk** containing the verified debug APK."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
